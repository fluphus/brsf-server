<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>BRS FRAGMENT · Save Manager</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="language-control"><label for="language-select" data-i18n="语言">语言</label><select id="language-select"><option value="system" data-i18n="自动">自动</option><option value="zh">简体中文</option><option value="ja">日本語</option><option value="en">English</option></select></div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <main id="login" class="login-wrap" hidden>
    <section class="login-card">
      <div class="brand-mark" aria-hidden="true">B/F</div>
      <p class="eyebrow">BLACK★ROCK SHOOTER FRAGMENT</p>
      <h1><span data-i18n="本地存档工作台">本地存档工作台</span></h1>
      <p class="muted"><span data-i18n="使用本机服主密钥登录，管理账号和存档。">使用本机服主密钥登录，管理账号和存档。</span></p>
      <form id="login-form">
        <label for="owner-key"><span data-i18n="服主密钥">服主密钥</span></label>
        <input id="owner-key" name="key" type="password" required autocomplete="off" spellcheck="false">
        <button type="submit" class="primary"><span data-i18n="登录工作台">登录工作台</span></button>
      </form>
    </section>
  </main>
  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">B/F</span><div><span data-i18n="存档工作台">存档工作台</span><small>BRS FRAGMENT</small></div></div>
      <nav aria-label="存档管理" data-i18n-aria-label="存档管理">
        <button data-page="accounts"><span aria-hidden="true">▤</span><span data-i18n="账号">账号</span></button>
        <button data-page="resources"><span aria-hidden="true">◇</span><span data-i18n="资源">资源</span></button>
        <button data-page="cards"><span aria-hidden="true">♙</span><span data-i18n="兵装">兵装</span></button>
        <button data-page="equipment"><span aria-hidden="true">⚒</span><span data-i18n="装备">装备</span></button>
        <button data-page="collection"><span aria-hidden="true">▧</span><span data-i18n="收藏">收藏</span></button>
        <button data-page="settings" class="global-nav"><span aria-hidden="true">⚙</span><span data-i18n="服务设置">服务设置</span></button>
      </nav>
      <section id="selected-account" class="selected-account" aria-label="当前账号" data-i18n-aria-label="当前账号"></section>
      <div class="sidebar-bottom"><span id="server-status"><span data-i18n="正在连接…">正在连接…</span></span><button id="logout" class="quiet"><span data-i18n="退出登录">退出登录</span></button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><p class="eyebrow"><span data-i18n="本地存档工作台">LOCAL SAVE MANAGER</span></p><h1 id="page-title"><span data-i18n="账号">账号</span></h1></div><div class="top-actions"><span id="draft-count" class="draft-count"><span data-i18n="没有未保存修改">没有未保存修改</span></span><button id="refresh"><span data-i18n="刷新">刷新</span></button></div></header>
      <div id="maintenance-banner" class="maintenance-banner"></div>
      <div id="page-content"></div>
    </main>
  </div>
  <dialog id="review-dialog" aria-labelledby="review-title">
    <div class="dialog-header"><div><p class="eyebrow"><span data-i18n="确认修改">REVIEW CHANGES</span></p><h2 id="review-title"><span data-i18n="确认修改">确认修改</span></h2></div><button type="button" data-close-dialog aria-label="关闭" data-i18n-aria-label="关闭">×</button></div>
    <div id="review-body"></div>
    <div class="dialog-actions"><button type="button" data-close-dialog><span data-i18n="返回编辑">返回编辑</span></button><button id="review-commit" type="button" class="primary"><span data-i18n="确认写入">确认写入</span></button></div>
  </dialog>
  <dialog id="credentials-dialog" aria-labelledby="credentials-title">
    <div class="dialog-header"><h2 id="credentials-title"><span data-i18n="请保存本次引继资料">请保存本次引继资料</span></h2></div>
    <p class="warning"><span data-i18n="请复制并保存引继 ID 和密码。">请复制并保存引继 ID 和密码。</span></p>
    <dl id="credentials-result" class="credential-values"></dl>
    <div class="dialog-actions"><button type="button" data-copy-credentials="id"><span data-i18n="复制 ID">复制 ID</span></button><button type="button" data-copy-credentials="password"><span data-i18n="复制密码">复制密码</span></button><button type="button" data-copy-credentials="all"><span data-i18n="复制全部">复制全部</span></button><button type="button" id="credentials-dismiss" class="primary"><span data-i18n="关闭">关闭</span></button></div>
  </dialog>
  <noscript><span data-i18n="请启用 JavaScript 后使用存档工作台。">请启用 JavaScript 后使用存档工作台。</span></noscript>
</body>
</html>
